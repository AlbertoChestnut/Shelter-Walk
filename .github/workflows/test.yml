# Runs the API tests and the browser smoke test on every push and pull
# request, so a change from any machine or session can't break the app
# unnoticed. Deploys stay manual.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: API tests
        run: npm test
      - name: Install browser for the smoke test
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run smoke
