# Runs the syntax check, the API tests (in UTC and in the shelter's time
# zone) and every browser smoke on every push and pull request, so a change
# from any machine or session can't break the app unnoticed. Deploys stay
# manual.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: API tests (UTC)
        run: npm test
        env:
          TZ: UTC
      - name: API tests (America/New_York)
        run: npm test
        env:
          TZ: America/New_York
      - name: Install browser for the smokes
        run: npx playwright install --with-deps chromium
      - name: Browser smokes
        run: npm run smoke:all
        env:
          SMOKE_TZ: America/New_York
