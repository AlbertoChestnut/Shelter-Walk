{% extends "base.html" %}
{% block head_title %}New invite{% endblock %}
{% block content %}
  <h1>New invite</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn primary">Create invite</button>
  </form>
  <a class="text-link" href="{% url 'staff_invite_list' %}">Back to invites</a>
{% endblock %}
