<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Volunteer sign-up sign</title>
  <style>
    @page { size: letter; margin: 0.6in; }
    body {
      font: 20px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1f2a24;
      text-align: center;
      margin: 0;
    }
    .sheet { max-width: 7in; margin: 0 auto; padding-top: .4in; }
    h1 { font-size: 44px; line-height: 1.1; margin: 0 0 .15in; }
    .sub { font-size: 22px; margin: 0 0 .35in; }
    .qr { width: 4.2in; height: 4.2in; margin: 0 auto; border: 6px solid #f2c14e; padding: .1in; }
    .qr svg { width: 100%; height: 100%; display: block; }
    .fallback { margin-top: .4in; font-size: 18px; }
    .code { font-size: 34px; font-weight: 700; letter-spacing: .08em; margin: .08in 0; }
    .meta { margin-top: .4in; font-size: 13px; color: #5b6b62; }
    .no-print { margin: 1rem; font-size: 15px; }
    @media print { .no-print { display: none; } }
  </style>
</head>
<body>
  <p class="no-print"><button onclick="window.print()">Print this sign</button></p>
  <div class="sheet">
    <h1>Volunteering here?</h1>
    <p class="sub">Scan to create your volunteer account.</p>
    <div class="qr">{{ qr_svg|safe }}</div>
    <div class="fallback">
      No camera? Go to <strong>{{ enter_code_url }}</strong> and enter
      <div class="code">{{ invite.formatted_code }}</div>
    </div>
    <p class="meta">
      {{ invite.label }}{% if invite.expires_at %}<br>Valid until {{ invite.expires_at|date:"M j, Y" }}{% endif %}
    </p>
  </div>
</body>
</html>
